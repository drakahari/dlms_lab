# Reviewed local-only Debian 13 offline image recipe. No host provisioning.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string learning-lab
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean false
d-i cdrom-detect/eject boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/non-free-firmware boolean false
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Learner
d-i passwd/username string learner
d-i passwd/user-password-crypted password !
d-i passwd/user-default-groups string users
d-i time/zone string Etc/UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
tasksel tasksel/first multiselect
d-i pkgsel/include string bash coreutils procps dbus libpam-systemd sudo=1.9.16p2-3+deb13u2 rsyslog=8.2504.0-1+deb13u2
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
# Pin and disable only d-i automatic guest-agent/microcode installation.
d-i preseed/late_command string set -e; echo "c60fe7bd0951c6a154a2fea25ebfb91549a1e30eff8798f1a49eafa01eb64b6a  /usr/lib/finish-install.d/08hw-detect" | sha256sum -c -; chmod -x /usr/lib/finish-install.d/08hw-detect; cp /finish-image.sh /target/tmp/finish-image.sh; cp /build-fixtures.sh /target/tmp/build-fixtures.sh; cp /learning-lab-LICENSE /target/tmp/learning-lab-LICENSE; cp /finalize-image.sh /target/usr/local/sbin/ll-image-finalize; cp /expected-packages.tsv /target/usr/local/sbin/ll-build-expected-packages.tsv; in-target /bin/sh /tmp/finish-image.sh; rm /target/tmp/finish-image.sh
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
